extends: substitution
message: "Канцелярит: используйте «%s» вместо «%s»."
level: error
ignorecase: true
swap:
  'осуществ[а-яё]+ настройк[а-яё]+': настроить
  'в случае если': если
  'в целях': чтобы
  'производится': "глагол в действительном залоге"
  'данн(ый|ая|ое|ые|ого|ой)': этот
  'вышеуказанн[а-яё]+': этот
  'необходимо (нажать|ввести|выбрать)': "повелительное наклонение"

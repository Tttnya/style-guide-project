extends: substitution
message: "Термин не из глоссария: используйте «%s» вместо «%s»."
level: error
ignorecase: true
swap:
  'тикет[а-яё]*': задача
  'таск[а-яё]*': задача
  'эндпоинт[а-яё]*': конечная точка
  'вебхук[а-яё]*': веб-перехватчик
  'деплой[а-яё]*': развёртывание
  'юзер[а-яё]*': пользователь
  'кликн[а-яё]+': нажмите
